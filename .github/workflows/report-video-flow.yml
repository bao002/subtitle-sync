name: Android Emulator Screencast & Report Video Flow

on:
  workflow_run:
    workflows:
      - "Android Emulator E2E Tests"
      - "Publish Web Demo to GitHub Pages"
      - "Report Integrity Verification"
    types:
      - completed
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: report-video-flow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-report-video-links:
    name: Check Report Video Links & Flag Status Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Check Report Video Links on GitHub Pages
        id: check_video
        run: |
          node scripts/update-readme.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CHECK_REMOTE_VIDEO: "false"
          STRICT_REPORT_CHECK: "false"
          FAILED_WORKFLOW: "Android Emulator Screencast & Report Video Flow"
          FAILED_STEP: "Report Integrity Check"

      - name: Acknowledge Screencast Video Deprecation
        if: always()
        run: |
          echo "ℹ️ Screencast video recording and static image artifacts are deprecated in favor of authentic live dialogue telemetry."
          echo "ℹ️ android-emulator-video.mp4 absence or 404 is non-blocking and will not trigger false failures."

      - name: Enforce Clean README & Flag Status Badge on Failure
        run: |
          # Revert any local file modifications so no automated commits pollute git history or cause merge conflicts
          git checkout -- README.md 2>/dev/null || true

          # Video artifacts are deprecated; only fail on genuine non-video errors
          if [ -f error.log ] && ! grep -q "android-emulator-video.mp4" error.log 2>/dev/null; then
            echo "::error::Integrity check failure detected in error.log."
            exit 1
          fi
          echo "✅ Report integrity check completed. Status badge reflects health."
