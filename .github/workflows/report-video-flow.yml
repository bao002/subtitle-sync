name: Android Emulator Screencast & Report Video Flow

on:
  workflow_run:
    workflows:
      - "Android Emulator E2E Tests"
      - "Publish Web Demo to GitHub Pages"
      - "Report Integrity Verification"
    types:
      - completed
  push:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: report-video-flow-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  check-report-video-links:
    name: Check Report Video Links & Flag Status Badge
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Check Report Video Links on GitHub Pages
        id: check_video
        run: |
          node scripts/update-readme.mjs
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          CHECK_REMOTE_VIDEO: "true"
          STRICT_REPORT_CHECK: "true"
          FAILED_WORKFLOW: "Android Emulator Screencast & Report Video Flow"
          FAILED_STEP: "Broken Video Link Detection in android-emulator-report.html"

      - name: Auto-Trigger Android Emulator E2E Tests on Broken Video Detection
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if grep -q "CI Failure in Android Emulator Screencast & Report Video Flow" README.md 2>/dev/null; then
            echo "⚠️ Screencast video returned HTTP 404 in android-emulator-report.html."
            echo "--> Auto-triggering 'Android Emulator E2E Tests' (emulation.yml) to record and publish screencast video..."
            gh workflow run emulation.yml -R "${{ github.repository }}" --ref "${{ github.ref_name }}" || gh workflow run "Android Emulator E2E Tests" -R "${{ github.repository }}" || echo "ℹ️ Automated dispatch attempted."
          fi

      - name: Enforce Clean README & Flag Status Badge on Failure
        run: |
          # Revert any local file modifications so no automated commits pollute git history or cause merge conflicts
          git checkout -- README.md 2>/dev/null || true

          # If the report video is broken or 404, fail the job so the workflow badge indicates the failure
          if [ -f error.log ] || grep -q "HTTP 404" error.log 2>/dev/null; then
            echo "::error::Screencast video asset returned HTTP 404 on GitHub Pages. Flagging workflow as failed so status badge reflects issue."
            exit 1
          fi
          echo "✅ Report video integrity check completed. Status badge reflects health."
