name: Report Integrity Verification

on:
  workflow_run:
    workflows: ["Publish Web Demo to GitHub Pages", "Web E2E Tests"]
    types:
      - completed
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: report-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-integrity:
    name: Verify Report and Presentation Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Normalize package registry URLs
        run: |
          if [ -f package-lock.json ]; then
            sed -i -E 's#https?://package-firewall\.replit\.internal/npm/#https://registry.npmjs.org/#g' package-lock.json 2>/dev/null || true
          fi

      - name: Install Dependencies
        run: npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Build Web Application
        run: npm run build

      - name: Run Repository Hygiene Verification
        run: npm run test:hygiene

      - name: Run Client SPA Architecture Verification
        run: npm run test:client-spa

      - name: Run Architectural Documentation Contracts Verification
        run: npm run test:doc-contracts

      - name: Run Markdown Link Cross-References Verification
        run: npm run test:md

      - name: Run README Links and Badges Verification
        run: npm run test:readme-links

      - name: Run Dedicated E2E Report Links Verification
        run: npm run test:e2e-report-links

      - name: Run Dedicated Report Video Links Verification
        run: npm run test:report-video-links
